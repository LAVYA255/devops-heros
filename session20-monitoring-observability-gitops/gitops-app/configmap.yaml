apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-demo-page
  namespace: session20
data:
  # Changing this value and pushing is the whole GitOps demo: ArgoCD notices the
  # commit and rolls the change out without anyone running kubectl.
  index.html: |
    <html>
      <body style="background:#0d1117;color:#58a6ff;font-family:monospace;text-align:center;padding-top:15vh">
        <h1>GitOps demo</h1>
        <p>version: v2</p>
        <p style="color:#8b949e">deployed by ArgoCD from git, not by kubectl</p>
      </body>
    </html>
