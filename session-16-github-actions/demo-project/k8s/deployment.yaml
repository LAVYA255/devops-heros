apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-api
  labels:
    app: calculator-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculator-api
  template:
    metadata:
      labels:
        app: calculator-api
    spec:
      containers:
        - name: api
          # The CD job rewrites this tag to the image it just pushed to GHCR.
          image: ghcr.io/lavya255/devops-heros/calculator-api:latest
          # The CD job loads the freshly built image straight into the cluster,
          # so it must not try to pull it from the registry.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: APP_VERSION
              value: "dev"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: calculator-api
  labels:
    app: calculator-api
spec:
  type: NodePort
  selector:
    app: calculator-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      nodePort: 30100
