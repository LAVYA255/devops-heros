name: Session 16 - CI/CD Pipeline

# CI runs on every push and PR that touches the demo project.
# CD (image push + deploy) only runs on main, which is the usual split:
# you want tests on every branch, but you only deploy from the trunk.
on:
  push:
    branches: [main]
    paths:
      - 'session-16-github-actions/demo-project/**'
      - '.github/workflows/session16-cicd.yml'
  pull_request:
    branches: [main]
    paths:
      - 'session-16-github-actions/demo-project/**'
  workflow_dispatch:

env:
  PROJECT_DIR: session-16-github-actions/demo-project
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/calculator-api

defaults:
  run:
    working-directory: session-16-github-actions/demo-project

jobs:
  # ---------------------------------------------------------------- CI: lint
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 app tests

  # ---------------------------------------------------------------- CI: test
  # A matrix so the same steps run against three interpreters in parallel.
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          pytest -v \
            --junitxml=test-results/results-${{ matrix.python-version }}.xml \
            --cov=app --cov-report=term-missing \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: |
            ${{ env.PROJECT_DIR }}/test-results/
            ${{ env.PROJECT_DIR }}/coverage-${{ matrix.python-version }}.xml
          retention-days: 7

  # ---------------------------------------------------------------- CI: build
  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Work out the image tag
        id: meta
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Building ${IMAGE}:${GITHUB_SHA::7}"

      # Build once and keep it as a tar so the smoke test and the push job
      # use the exact same bits rather than rebuilding.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name smoke -p 5000:5000 "${{ steps.meta.outputs.sha_tag }}"
          for i in $(seq 1 20); do
            if curl -sf http://localhost:5000/healthz; then OK=1; break; fi
            sleep 2
          done
          echo
          [ "${OK:-0}" = "1" ] || { echo "container never became healthy"; docker logs smoke; exit 1; }
          echo "GET /calc?op=multiply&a=6&b=7 ->"
          curl -sf "http://localhost:5000/calc?op=multiply&a=6&b=7"
          echo
          docker rm -f smoke

      - name: Save image as an artifact
        run: docker save "${{ steps.meta.outputs.sha_tag }}" -o /tmp/calculator-api.tar

      - uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: /tmp/calculator-api.tar
          retention-days: 3

  # ---------------------------------------------------------------- CD: push
  publish:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN is injected automatically; no secret had to be created by hand.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: true
          tags: |
            ${{ needs.build.outputs.image }}:latest
            ${{ needs.build.outputs.image }}:${{ github.sha }}
          cache-from: type=gha

      - name: Summary
        run: |
          echo "### Pushed image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ needs.build.outputs.image }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ needs.build.outputs.image }}:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- CD: deploy
  # A real cluster, created inside the runner with kind, so the deploy step is
  # genuinely exercised rather than just echoed.
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build, publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cd-target

      - uses: actions/download-artifact@v4
        with:
          name: container-image
          path: /tmp

      - name: Load the image we built into the cluster
        run: |
          docker load -i /tmp/calculator-api.tar
          docker images --format '{{.Repository}}:{{.Tag}}' | grep calculator-api
          IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep calculator-api | head -1)
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          kind load docker-image "$IMAGE" --name cd-target

      - name: Deploy
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/calculator-api "api=${IMAGE}"
          kubectl set env deployment/calculator-api "APP_VERSION=${GITHUB_SHA::7}"
          kubectl rollout status deployment/calculator-api --timeout=180s

      - name: Verify the deployment
        run: |
          kubectl get deploy,pods,svc -l app=calculator-api
          echo "--- smoke test through the Service"
          kubectl run verifier --rm -i --restart=Never --image=curlimages/curl:8.5.0 -- \
            sh -c 'curl -sf http://calculator-api/healthz && echo && curl -sf "http://calculator-api/calc?op=add&a=40&b=2"'

      - name: Deployment summary
        run: |
          {
            echo "### Deployed to kind"
            echo '```'
            kubectl get deploy,svc -l app=calculator-api
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
