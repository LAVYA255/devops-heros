name: Session 17 - DevSecOps Pipeline

# Flow: Code -> Build -> Unit Test -> SAST -> SCA -> Secret Scan
#       -> Docker Build -> Image Scan -> Security Gate -> Push -> Deploy
#
# The three scanners run in parallel because none of them depends on the others.
# The gate waits for all of them, and the image is only pushed if the gate passes.
on:
  push:
    branches: [main]
    paths:
      - 'session-17-devsecops/demo-project/**'
      - '.github/workflows/session17-devsecops.yml'
  pull_request:
    branches: [main]
    paths:
      - 'session-17-devsecops/demo-project/**'
  workflow_dispatch:

env:
  PROJECT_DIR: session-17-devsecops/demo-project
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/devsecops-api

defaults:
  run:
    working-directory: session-17-devsecops/demo-project

jobs:
  # ================================================= 1. build + unit test
  test:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ env.PROJECT_DIR }}/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: flake8 app tests

      - name: Unit tests with coverage
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: ${{ env.PROJECT_DIR }}/coverage.xml
          retention-days: 7

  # ================================================= 2. SAST
  # Static analysis of our own source. Bandit understands Python security
  # anti-patterns (eval, shell=True, hardcoded passwords, debug servers).
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install bandit
        run: pip install 'bandit[toml]==1.8.6'

      # Scan the shipped application only. The vulnerable sample under
      # security/ is excluded on purpose - it exists to be found, not to block.
      - name: Run bandit on application code
        run: |
          bandit -r app -f txt -o bandit-report.txt --severity-level low || true
          cat bandit-report.txt
          bandit -r app -f json -o bandit-report.json --severity-level low || true

      - name: Fail on any HIGH severity finding
        run: |
          HIGH=$(python -c "import json;d=json.load(open('bandit-report.json'));print(sum(1 for r in d['results'] if r['issue_severity']=='HIGH'))")
          echo "bandit HIGH findings: $HIGH"
          echo "SAST_HIGH=$HIGH" >> "$GITHUB_ENV"
          [ "$HIGH" = "0" ] || { echo "::error::SAST found $HIGH HIGH severity issues"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-bandit
          path: |
            ${{ env.PROJECT_DIR }}/bandit-report.txt
            ${{ env.PROJECT_DIR }}/bandit-report.json
          retention-days: 7

  # ================================================= 3. SCA
  # Software Composition Analysis: known CVEs in third-party dependencies.
  sca:
    name: SCA (pip-audit)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit==2.9.0

      - name: Audit runtime dependencies
        run: |
          set +e
          pip-audit -r requirements.txt --desc 2>&1 | tee pip-audit-report.txt
          echo "exit=$?"
          pip-audit -r requirements.txt -f json -o pip-audit-report.json 2>/dev/null
          set -e

      - name: Fail if any dependency has a known vulnerability
        run: |
          COUNT=$(python -c "
          import json,os
          p='pip-audit-report.json'
          if not os.path.exists(p): print(0); raise SystemExit
          d=json.load(open(p))
          deps=d.get('dependencies',d) if isinstance(d,dict) else d
          print(sum(len(x.get('vulns',[])) for x in deps))
          ")
          echo "vulnerable dependencies: $COUNT"
          [ "$COUNT" = "0" ] || { echo "::error::SCA found $COUNT vulnerable dependencies"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-pip-audit
          path: |
            ${{ env.PROJECT_DIR }}/pip-audit-report.txt
            ${{ env.PROJECT_DIR }}/pip-audit-report.json
          retention-days: 7

  # ================================================= 4. secret scanning
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    needs: test
    steps:
      # Full history: a secret that was committed and later deleted is still
      # a leaked secret, so scanning only the working tree is not enough.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks against the working tree
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo/session-17-devsecops/demo-project/app \
            --no-git --redact --verbose \
            --report-format=json --report-path=/repo/${{ env.PROJECT_DIR }}/gitleaks-report.json \
            | tee gitleaks-report.txt
        continue-on-error: true

      - name: Fail if any secret was found in shipped code
        run: |
          if [ -s gitleaks-report.json ]; then
            COUNT=$(python3 -c "import json;print(len(json.load(open('gitleaks-report.json'))))")
          else
            COUNT=0
          fi
          echo "secrets found in app/: $COUNT"
          [ "$COUNT" = "0" ] || { echo "::error::Secret scanning found $COUNT secrets"; exit 1; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-gitleaks
          path: ${{ env.PROJECT_DIR }}/gitleaks-report.*
          retention-days: 7

  # ================================================= 5. docker build + image scan
  image:
    name: Docker Build and Image Scan
    runs-on: ubuntu-latest
    needs: [sast, sca, secret-scan]
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Work out the image tag
        id: meta
        run: |
          IMAGE=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${IMAGE}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy scans the OS packages and the Python libraries inside the built
      # image, which catches things the source-level scanners cannot see.
      - name: Trivy image scan (report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.sha_tag }}
          format: table
          output: trivy-report.txt
          severity: LOW,MEDIUM,HIGH,CRITICAL
          scanners: vuln,secret,misconfig

      - name: Show the report
        run: cat trivy-report.txt || true

      - name: Trivy image scan (gate on HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.sha_tag }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Save image for the deploy job
        run: docker save "${{ steps.meta.outputs.sha_tag }}" -o /tmp/devsecops-api.tar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-scan-trivy
          path: ${{ env.PROJECT_DIR }}/trivy-report.txt
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: container-image
          path: /tmp/devsecops-api.tar
          retention-days: 3

  # ================================================= 6. security gate
  # One explicit place that says yes or no. Everything downstream depends on it,
  # so a red scanner stops the release rather than just colouring a badge.
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [sast, sca, secret-scan, image]
    if: always()
    steps:
      - name: Evaluate all security stages
        run: |
          echo "SAST (bandit)        : ${{ needs.sast.result }}"
          echo "SCA (pip-audit)      : ${{ needs.sca.result }}"
          echo "Secret scan (gitleaks): ${{ needs.secret-scan.result }}"
          echo "Image scan (trivy)   : ${{ needs.image.result }}"
          {
            echo "### Security gate"
            echo ""
            echo "| Stage | Tool | Result |"
            echo "| --- | --- | --- |"
            echo "| SAST | bandit | ${{ needs.sast.result }} |"
            echo "| SCA | pip-audit | ${{ needs.sca.result }} |"
            echo "| Secret scanning | gitleaks | ${{ needs.secret-scan.result }} |"
            echo "| Image scan | trivy | ${{ needs.image.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.sast.result }}" != "success" ] || \
             [ "${{ needs.sca.result }}" != "success" ] || \
             [ "${{ needs.secret-scan.result }}" != "success" ] || \
             [ "${{ needs.image.result }}" != "success" ]; then
            echo "::error::Security gate FAILED - the release is blocked"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Gate: BLOCKED**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Security gate PASSED - release may proceed"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Gate: PASSED**" >> "$GITHUB_STEP_SUMMARY"

  # ================================================= 7. push to registry
  publish:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: [image, security-gate]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.PROJECT_DIR }}
          push: true
          tags: |
            ${{ needs.image.outputs.image }}:latest
            ${{ needs.image.outputs.image }}:${{ github.sha }}
          cache-from: type=gha

  # ================================================= 8. deploy
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [image, publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: devsecops-target

      - uses: actions/download-artifact@v4
        with:
          name: container-image
          path: /tmp

      - name: Load the scanned image into the cluster
        run: |
          docker load -i /tmp/devsecops-api.tar
          IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep devsecops-api | head -1)
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          kind load docker-image "$IMAGE" --name devsecops-target

      - name: Create the application secret
        run: |
          kubectl create secret generic devsecops-api-secret \
            --from-literal=API_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/devsecops-api api="${IMAGE}"
          kubectl set env deployment/devsecops-api APP_VERSION="${GITHUB_SHA::7}"
          kubectl rollout status deployment/devsecops-api --timeout=180s

      - name: Verify
        run: |
          kubectl get deploy,pods,svc -l app=devsecops-api
          kubectl run verifier --rm -i --restart=Never --image=curlimages/curl:8.5.0 -- \
            sh -c 'curl -sf http://devsecops-api/healthz && echo && curl -sf "http://devsecops-api/calc?op=add&a=40&b=2" && echo && curl -sf http://devsecops-api/whoami'

      - name: Confirm the container is not running as root
        run: |
          POD=$(kubectl get pod -l app=devsecops-api -o jsonpath='{.items[0].metadata.name}')
          echo -n "running as: "; kubectl exec "$POD" -- whoami
          kubectl exec "$POD" -- id
