# Default values for the Kharcha chart.
# Environment-specific overrides live outside the chart, e.g. gitops/values-minikube.yaml.

images:
  # ghcr.io/<owner>; CI pushes kharcha-backend and kharcha-frontend here.
  registry: ghcr.io/lavya255
  # Always a git commit SHA, never "latest". A floating tag makes it impossible
  # to say which code is running, and makes rollbacks meaningless.
  tag: ""
  pullPolicy: IfNotPresent

# e.g. [{ name: ghcr-pull }] when the registry is private.
imagePullSecrets: []

backend:
  image: kharcha-backend
  replicas: 2
  port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 500m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

frontend:
  image: kharcha-frontend
  replicas: 2
  port: 8080
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 96Mi

# Non-secret runtime settings. Rendered into a ConfigMap.
config:
  currency: INR
  monthlyBudget: "20000"

database:
  # Empty means the bundled Postgres below. To use a managed database, set
  # this to its endpoint AND postgres.enabled: false. Setting both is refused
  # at render time (see kharcha.dbHost in _helpers.tpl for why).
  host: ""
  name: kharcha
  user: kharcha
  # Name of an EXISTING Secret holding the password under the key "password".
  # The chart never creates it, so no password is ever rendered from values or
  # stored in git. See kubernetes/create-db-secret.sh.
  existingSecret: kharcha-db

postgres:
  # The bundled single-instance PostgreSQL. Set enabled: false and point
  # database.host at a managed database (RDS) in a real environment.
  enabled: true
  image: postgres:16-alpine
  storage: 1Gi
  # "" uses the cluster's default StorageClass.
  storageClass: ""
  # Sized for the backend at its HPA maximum (6 pods), measured under
  # scripts/load-test.sh: with a 500m limit Postgres sat at exactly 0.5 cores,
  # throttled, while six API pods waited on it. One database serves every
  # replica, so it gets a real request and room to burst.
  resources:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 1500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  host: kharcha.local
  # More hostnames serving the same routes, e.g. a nip.io name that resolves to
  # 127.0.0.1 so a browser can reach the Ingress without editing a hosts file.
  extraHosts: []

metrics:
  # Adds prometheus.io/* annotations so Prometheus' kubernetes-pods job finds
  # the backend without a ServiceMonitor CRD.
  scrape: true
