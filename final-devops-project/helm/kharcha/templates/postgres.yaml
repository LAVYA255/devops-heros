{{- if .Values.postgres.enabled }}
{{- $name := include "kharcha.dbHost" . -}}
# Headless Service: gives the StatefulSet pod its stable DNS identity
# (kharcha-postgres-0.kharcha-postgres-headless). Required by serviceName below.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-headless
  labels:
    {{- include "kharcha.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    {{- include "kharcha.selector" (dict "root" . "component" "database") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
# Normal ClusterIP Service: what the backend actually connects to.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "kharcha.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    {{- include "kharcha.selector" (dict "root" . "component" "database") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "kharcha.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ $name }}-headless
  replicas: 1
  selector:
    matchLabels:
      {{- include "kharcha.selector" (dict "root" . "component" "database") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kharcha.selector" (dict "root" . "component" "database") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kharcha.fullname" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- include "kharcha.podSecurity" . | nindent 8 }}
        # uid/gid 70 is the "postgres" user in the alpine image.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: password
            # A subdirectory, because the root of a freshly provisioned volume
            # often contains lost+found, and initdb refuses a non-empty directory.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            # Postgres must write to /var/run/postgresql and its data dir; both
            # are mounted volumes, so the image itself can stay read-only.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  # One PersistentVolumeClaim per replica, created from this template. It is
  # NOT deleted when the StatefulSet or the Helm release is deleted, on purpose:
  # uninstalling the app should not silently destroy the data.
  # apiVersion, kind and volumeMode are written out even though they are the
  # defaults: the API server stores them on the live object, and without them
  # ArgoCD showed this StatefulSet as OutOfSync forever. VCTs are immutable,
  # so the rendered template has to match what Kubernetes keeps, field for field.
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: data
        labels:
          {{- include "kharcha.selector" (dict "root" . "component" "database") | nindent 10 }}
      spec:
        accessModes: ["ReadWriteOnce"]
        volumeMode: Filesystem
        {{- if .Values.postgres.storageClass }}
        storageClassName: {{ .Values.postgres.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
