{{- $name := printf "%s-frontend" (include "kharcha.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "kharcha.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "kharcha.selector" (dict "root" . "component" "frontend") | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "kharcha.selector" (dict "root" . "component" "frontend") | nindent 8 }}
        app.kubernetes.io/version: {{ include "kharcha.tag" . | quote }}
    spec:
      serviceAccountName: {{ include "kharcha.fullname" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "kharcha.podSecurity" . | nindent 8 }}
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: web
          image: {{ include "kharcha.frontendImage" . }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.frontend.port }}
          env:
            # nginx's resolver does not apply the search domains from
            # resolv.conf, so a short name like "kharcha-backend" would not
            # resolve. The fully qualified service name always does.
            - name: BACKEND_UPSTREAM
              value: "http://{{ include "kharcha.fullname" . }}-backend.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.backend.port }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          # Same race as the backend: keep serving while the pod is being taken
          # out of the Service endpoints, then let nginx shut down gracefully.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          securityContext:
            {{- include "kharcha.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          volumeMounts:
            # Read-only root filesystem: nginx still needs somewhere to write its
            # rendered config, cache and pid file.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
