# A dedicated identity for the app pods. None of them talk to the Kubernetes
# API, so the token is not mounted at all: a compromised pod gets no free
# credentials to the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kharcha.fullname" . }}
  labels:
    {{- include "kharcha.labels" . | nindent 4 }}
automountServiceAccountToken: false
