{{- if .Values.ingress.enabled }}
{{- $root := . -}}
# One way in. /api and /health go straight to the backend; everything else
# goes to the frontend. Paths are matched longest-first, so /api wins over /.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kharcha.fullname" . }}
  labels:
    {{- include "kharcha.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range (prepend .Values.ingress.extraHosts .Values.ingress.host) }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "kharcha.fullname" $root }}-backend
                port:
                  name: http
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ include "kharcha.fullname" $root }}-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "kharcha.fullname" $root }}-frontend
                port:
                  name: http
    {{- end }}
{{- end }}
