apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kharcha.fullname" . }}-config
  labels:
    {{- include "kharcha.labels" . | nindent 4 }}
data:
  CURRENCY: {{ .Values.config.currency | quote }}
  MONTHLY_BUDGET: {{ .Values.config.monthlyBudget | quote }}
  APP_VERSION: {{ include "kharcha.tag" . | quote }}
  DB_HOST: {{ include "kharcha.dbHost" . | quote }}
  DB_NAME: {{ .Values.database.name | quote }}
  DB_USER: {{ .Values.database.user | quote }}
