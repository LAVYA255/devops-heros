# Environment values for the local Minikube cluster, layered on top of the
# chart's values.yaml. This is the file the GitOps loop changes: CI writes the
# new image tag here and commits it, and ArgoCD rolls the cluster to match.

images:
  registry: ghcr.io/lavya255
  # Set by CI to the commit SHA it just built, scanned and pushed.
  tag: "352be7d"
  pullPolicy: IfNotPresent

ingress:
  host: kharcha.local
  # Resolves to 127.0.0.1 via public DNS, so the Windows browser reaches the
  # Ingress through a port-forward with no hosts-file edit.
  extraHosts:
    - kharcha.127.0.0.1.nip.io

config:
  monthlyBudget: "20000"
