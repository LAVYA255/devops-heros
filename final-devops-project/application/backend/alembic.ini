[alembic]
script_location = alembic
# Puts the backend directory on sys.path so env.py can `import app`. Without it
# the `alembic` console script fails with "No module named 'app'", because its
# sys.path starts at its own bin/ directory, not the working directory.
prepend_sys_path = .
# The real URL comes from the DATABASE_URL environment variable (see
# alembic/env.py), so no credentials ever live in this file.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
