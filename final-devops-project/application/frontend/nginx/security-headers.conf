# Included in every location that sets its own add_header.
#
# nginx gotcha: add_header directives are only inherited from the enclosing
# block if the current block defines NO add_header of its own. So the moment a
# location adds Cache-Control, every security header set at server level is
# silently dropped for that location. Including this file in each such location
# is the fix.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
