# grafana/grafana 10.5.15 (Grafana 12.3.1)
#   helm upgrade --install grafana grafana/grafana \
#     --version 10.5.15 -n monitoring -f monitoring/grafana-values.yaml
#
# Nothing is clicked together in the UI. The Prometheus data source is
# provisioned below, and the dashboard is a JSON file in this repo, loaded by
# the dashboard sidecar from a ConfigMap labelled grafana_dashboard=1
# (see monitoring/install.sh). Change the JSON, re-create the ConfigMap, and
# Grafana picks it up within a minute.

# The admin password is generated by the chart into a Secret, never set here:
#   kubectl get secret grafana -n monitoring -o jsonpath='{.data.admin-password}' | base64 -d

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        jsonData:
          timeInterval: 15s

sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: monitoring
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: false

grafana.ini:
  # LOCAL CLUSTER ONLY: read-only anonymous viewing, so the dashboard can be
  # opened through a port-forward without handing out the admin password.
  # Viewers cannot edit anything. Do not copy this to a cluster with an
  # internet-facing Grafana.
  auth.anonymous:
    enabled: true
    org_role: Viewer
  dashboards:
    default_home_dashboard_path: /tmp/dashboards/kharcha.json
  analytics:
    reporting_enabled: false
    check_for_updates: false

persistence:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi
